<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="feGlow1" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="feGlow2" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#0d0a0f"/>
  <rect width="1200" height="675" fill="url(#feGlow1)"/>
  <rect width="1200" height="675" fill="url(#feGlow2)"/>

  <!-- Left: Content Info -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="190" height="36" rx="18" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="5" fill="#fb7185"/>
    <text x="36" y="23" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fb7185" letter-spacing="1">INDUSTRY PERSPECTIVE</text>

    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Bricolage Grotesque', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Is Frontend Dev Dead?
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Bricolage Grotesque', sans-serif" font-size="52" font-weight="900" fill="#fb7185" letter-spacing="-1.5">
      The Truth Behind the Hype
    </text>

    <text x="0" y="215" font-family="-apple-system, sans-serif" font-size="20" fill="#9ca3af" font-weight="400">
      Boilerplate UI is automated. Real frontend engineering just leveled up.
    </text>

    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="530" height="70" rx="14" fill="#1c1218" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.3"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
        The Bar Has Moved Up:
      </text>
      <text x="20" y="54" font-family="-apple-system, sans-serif" font-size="13" fill="#9ca3af">
        State Machines • Edge Streaming • High-Precision INP • Distributed Cache
      </text>
    </g>
  </g>

  <!-- Right: Split Reality Card -->
  <g transform="translate(730, 120)">
    <rect width="400" height="420" rx="20" fill="#161017" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
    
    <!-- Top Half: What is Dead -->
    <g transform="translate(25, 25)">
      <rect width="350" height="170" rx="12" fill="#201115" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.4"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#f87171">💀 WHAT IS DEAD</text>
      <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="13" fill="#e5e7eb">• Hand-writing static CSS/Tailwind boxes</text>
      <text x="20" y="92" font-family="-apple-system, sans-serif" font-size="13" fill="#e5e7eb">• Generic boilerplate CRUD admin pages</text>
      <text x="20" y="119" font-family="-apple-system, sans-serif" font-size="13" fill="#e5e7eb">• Blindly copying component templates</text>
      <text x="20" y="146" font-family="monospace" font-size="11" fill="#f87171">Commoditized by LLMs</text>
    </g>

    <!-- Bottom Half: What Thrives -->
    <g transform="translate(25, 215)">
      <rect width="350" height="175" rx="12" fill="#122018" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#34d399">🚀 WHAT MATTERS NOW</text>
      <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="13" fill="#e5e7eb">• Complex interactive client state</text>
      <text x="20" y="92" font-family="-apple-system, sans-serif" font-size="13" fill="#e5e7eb">• Server-driven UI &amp; Edge hydration</text>
      <text x="20" y="119" font-family="-apple-system, sans-serif" font-size="13" fill="#e5e7eb">• Zero-CLS &amp; sub-50ms INP optimization</text>
      <text x="20" y="146" font-family="monospace" font-size="11" fill="#34d399">High-Leverage Engineering</text>
    </g>
  </g>
</svg>