<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="beGlow1" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beGlow2" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#090d14"/>
  <rect width="1200" height="675" fill="url(#beGlow1)"/>
  <rect width="1200" height="675" fill="url(#beGlow2)"/>

  <!-- Left: Content Info -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="200" height="36" rx="18" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="5" fill="#38bdf8"/>
    <text x="36" y="23" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">SYSTEM ARCHITECTURE</text>

    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Bricolage Grotesque', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Scalable Backend Systems:
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Bricolage Grotesque', sans-serif" font-size="52" font-weight="900" fill="#38bdf8" letter-spacing="-1.5">
      High-Throughput Principles
    </text>

    <text x="0" y="215" font-family="-apple-system, sans-serif" font-size="20" fill="#9ca3af" font-weight="400">
      Multi-tier caching, asynchronous message queues, connection pooling &amp; idempotency.
    </text>

    <!-- Key Stats/Metrics -->
    <g transform="translate(0, 270)">
      <g transform="translate(0, 0)">
        <text x="0" y="30" font-family="monospace" font-size="34" font-weight="900" fill="#38bdf8">99.99%</text>
        <text x="0" y="55" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">UPTIME TARGET</text>
      </g>
      <g transform="translate(160, 0)">
        <text x="0" y="30" font-family="monospace" font-size="34" font-weight="900" fill="#34d399">&lt;15ms</text>
        <text x="0" y="55" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">P99 LATENCY</text>
      </g>
      <g transform="translate(320, 0)">
        <text x="0" y="30" font-family="monospace" font-size="34" font-weight="900" fill="#fbbf24">100k+</text>
        <text x="0" y="55" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">RPS CONCURRENCY</text>
      </g>
    </g>
  </g>

  <!-- Right: Architecture Graph Diagram -->
  <g transform="translate(730, 130)">
    <rect width="400" height="400" rx="20" fill="#0e1622" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
    
    <!-- Client Requests -->
    <rect x="140" y="30" width="120" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="200" y="55" text-anchor="middle" font-family="monospace" font-size="13" fill="#38bdf8">Edge Gateway</text>

    <line x1="200" y1="70" x2="200" y2="110" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Load Balancer / Redis Layer -->
    <rect x="70" y="110" width="110" height="48" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="125" y="138" text-anchor="middle" font-family="monospace" font-size="12" fill="#f87171">Redis Cluster</text>

    <rect x="220" y="110" width="110" height="48" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="275" y="138" text-anchor="middle" font-family="monospace" font-size="12" fill="#34d399">App Service</text>

    <line x1="275" y1="158" x2="275" y2="200" stroke="#34d399" stroke-width="2"/>

    <!-- Message Queue -->
    <rect x="140" y="200" width="120" height="48" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1"/>
    <text x="200" y="228" text-anchor="middle" font-family="monospace" font-size="12" fill="#fde047">RabbitMQ / Kafka</text>

    <line x1="200" y1="248" x2="200" y2="290" stroke="#eab308" stroke-width="2"/>

    <!-- Database Replicas -->
    <rect x="70" y="290" width="110" height="48" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
    <text x="125" y="318" text-anchor="middle" font-family="monospace" font-size="12" fill="#93c5fd">DB Primary</text>

    <rect x="220" y="290" width="110" height="48" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
    <text x="275" y="318" text-anchor="middle" font-family="monospace" font-size="12" fill="#93c5fd">DB Replicas</text>
  </g>
</svg>