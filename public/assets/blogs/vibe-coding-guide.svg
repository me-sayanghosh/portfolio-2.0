<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="glow1" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1f26" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#12151b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="#0c0e12"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675"/>
  </g>

  <!-- Left: Content Info -->
  <g transform="translate(100, 140)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="5" fill="#34d399"/>
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#34d399" letter-spacing="1">AI WORKFLOW</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Bricolage Grotesque', sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="-1.5">
      How to Make Vibe Coding
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Bricolage Grotesque', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Easy, Fast &amp; Maintainable
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#9ca3af" font-weight="400">
      Stop fighting spaghetti code. Master the atomic micro-loop workflow.
    </text>

    <!-- Step Flow Badges -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="110" height="42" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="55" y="26" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#34d399">1. SPECS</text>
      
      <path d="M120 21 L145 21" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
      <polygon points="145,17 155,21 145,25" fill="#6b7280"/>

      <rect x="165" y="0" width="110" height="42" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="220" y="26" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#60a5fa">2. PROMPT</text>

      <polygon points="285,17 295,21 285,25" fill="#6b7280"/>

      <rect x="305" y="0" width="110" height="42" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="360" y="26" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#fbbf24">3. VERIFY</text>

      <polygon points="425,17 435,21 425,25" fill="#6b7280"/>

      <rect x="445" y="0" width="110" height="42" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1"/>
      <text x="500" y="26" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#ec4899">4. COMMIT</text>
    </g>
  </g>

  <!-- Right: Glassmorphic IDE Mockup -->
  <g transform="translate(730, 110)">
    <!-- IDE Window -->
    <rect width="410" height="440" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.6))"/>
    
    <!-- Titlebar -->
    <rect width="410" height="42" rx="20" fill="#161a22" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
    <circle cx="25" cy="21" r="6" fill="#ef4444"/>
    <circle cx="45" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="65" cy="21" r="6" fill="#10b981"/>
    <text x="205" y="26" text-anchor="middle" font-family="monospace" font-size="12" fill="#9ca3af">vibe-controller.ts</text>

    <!-- Code Content -->
    <g transform="translate(30, 70)" font-family="monospace" font-size="13">
      <text y="0" fill="#6b7280">// Step 1: Strict Spec Boundaries</text>
      <text y="30" fill="#c084fc">interface <tspan fill="#60a5fa">VibeContext</tspan> {</text>
      <text y="55" fill="#9ca3af">  spec: <tspan fill="#34d399">MarkdownDoc</tspan>;</text>
      <text y="80" fill="#9ca3af">  maxEdits: <tspan fill="#fbbf24">3</tspan>;</text>
      <text y="105" fill="#9ca3af">  verifyStrict: <tspan fill="#ec4899">true</tspan>;</text>
      <text y="130" fill="#c084fc">}</text>
      
      <text y="170" fill="#6b7280">// Step 2: Atomic Execution</text>
      <text y="200" fill="#38bdf8">async function <tspan fill="#fbbf24">vibeLoop</tspan>() {</text>
      <text y="225" fill="#9ca3af">  const diff = <tspan fill="#c084fc">await</tspan> agent.step();</text>
      <text y="250" fill="#9ca3af">  <tspan fill="#c084fc">await</tspan> typecheck(); <tspan fill="#34d399">// 0 errors</tspan></text>
      <text y="275" fill="#9ca3af">  return git.savePoint();</text>
      <text y="300" fill="#38bdf8">}</text>
    </g>

    <!-- Floating Badge -->
    <g transform="translate(180, 360)">
      <rect width="200" height="50" rx="12" fill="#090a0f" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="28" cy="25" r="8" fill="#10b981" fill-opacity="0.2"/>
      <circle cx="28" cy="25" r="4" fill="#34d399"/>
      <text x="48" y="29" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">VERIFIED PASS</text>
      <text x="155" y="29" font-family="monospace" font-size="12" fill="#9ca3af">100%</text>
    </g>
  </g>
</svg>