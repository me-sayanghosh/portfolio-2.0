<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="prGlow1" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="prGlow2" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="#0b0a12"/>
  <rect width="1200" height="675" fill="url(#prGlow1)"/>
  <rect width="1200" height="675" fill="url(#prGlow2)"/>

  <!-- Left Side Text -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="190" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="5" fill="#a78bfa"/>
    <text x="36" y="23" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" letter-spacing="1">AGENTIC PROMPTING</text>

    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Bricolage Grotesque', sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Stop Prompting Like a Noob
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Bricolage Grotesque', sans-serif" font-size="52" font-weight="900" fill="#c084fc" letter-spacing="-1.5">
      To Your AI Coding Agent
    </text>

    <text x="0" y="215" font-family="-apple-system, sans-serif" font-size="20" fill="#9ca3af" font-weight="400">
      How elite developers formulate context, tools &amp; negative boundaries.
    </text>

    <!-- Formula Pills -->
    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="530" height="52" rx="14" fill="#181524" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.3"/>
      <text x="25" y="32" font-family="monospace" font-size="15" fill="#9ca3af">
        <tspan fill="#a78bfa" font-weight="700">Formula =</tspan> Objective + Bounds + Tool Scopes + Verification
      </text>
    </g>
  </g>

  <!-- Right Side: Comparison Terminal -->
  <g transform="translate(720, 120)">
    <rect width="420" height="420" rx="20" fill="#14121d" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
    
    <!-- Noob Prompt Box -->
    <g transform="translate(25, 30)">
      <rect width="370" height="150" rx="14" fill="#1e1317" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f87171">❌ NOOB PROMPT</text>
      <text x="20" y="65" font-family="monospace" font-size="12" fill="#d1d5db">"Hey, add auth to my app and</text>
      <text x="20" y="88" font-family="monospace" font-size="12" fill="#d1d5db">make it look modern and secure."</text>
      <text x="20" y="125" font-family="monospace" font-size="11" fill="#ef4444">Result: 45 broken files, 12 new deps</text>
    </g>

    <!-- Pro Prompt Box -->
    <g transform="translate(25, 205)">
      <rect width="370" height="185" rx="14" fill="#131e1a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">✅ PRO AGENT PROMPT</text>
      <text x="20" y="65" font-family="monospace" font-size="12" fill="#d1d5db">"TASK: Implement JWT verify middleware</text>
      <text x="20" y="88" font-family="monospace" font-size="12" fill="#d1d5db">TARGET: src/middleware/auth.ts</text>
      <text x="20" y="111" font-family="monospace" font-size="12" fill="#d1d5db">CONSTRAINTS: Zero extra deps. No any.</text>
      <text x="20" y="134" font-family="monospace" font-size="12" fill="#d1d5db">VERIFICATION: Run npx tsc before exit."</text>
      <text x="20" y="165" font-family="monospace" font-size="11" fill="#34d399">Result: 1 atomic diff, 100% tests pass</text>
    </g>
  </g>
</svg>