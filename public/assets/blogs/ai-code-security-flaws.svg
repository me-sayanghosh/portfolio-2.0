<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151921" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e1117" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Base Background -->
  <rect width="1200" height="675" fill="#090b0e"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675"/>
  </g>

  <!-- Left: Editorial Content -->
  <g transform="translate(80, 110)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="185" height="34" rx="17" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4.5" fill="#ef4444"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fca5a5" letter-spacing="1.2">AI CODE SECURITY</text>

    <!-- Headline with High Contrast Highlight (Styled like User's Inspiration) -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1.2">
      Nearly Half of AI Code
    </text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1.2">
      Has Security Flaws.
    </text>

    <!-- Neon Lime Accent Pill (Matching user's "pairings" / "Branding" highlight) -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="220" height="42" rx="8" fill="#bef264"/>
      <text x="14" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#0f172a" letter-spacing="-0.5">OR DOES IT?</text>
    </g>

    <!-- Subtitle / Hook -->
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8" font-weight="400">
      Veracode reported 45% vulnerability rates across 100+ LLMs.
    </text>
    <text x="0" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8" font-weight="400">
      Yet real GitHub pull requests show 87.9% clean. Why the data diverges.
    </text>

    <!-- Key Metrics Pills Bar -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="150" height="58" rx="12" fill="#1e1820" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.2"/>
      <text x="16" y="24" font-family="monospace" font-size="11" fill="#f87171" font-weight="600">VERACODE RISK</text>
      <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">45.0%</text>

      <rect x="165" y="0" width="150" height="58" rx="12" fill="#13211c" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2"/>
      <text x="181" y="24" font-family="monospace" font-size="11" fill="#34d399" font-weight="600">GITHUB REPOS</text>
      <text x="181" y="48" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">87.9% <tspan font-size="13" fill="#34d399">CLEAN</tspan></text>

      <rect x="330" y="0" width="165" height="58" rx="12" fill="#1b1c24" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.2"/>
      <text x="346" y="24" font-family="monospace" font-size="11" fill="#818cf8" font-weight="600">2026 BENCHMARK</text>
      <text x="346" y="48" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">25.7% <tspan font-size="12" fill="#94a3b8">DOWN 36%</tspan></text>
    </g>

    <!-- Editorial Footer Tag -->
    <g transform="translate(0, 425)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#64748b" letter-spacing="0.5">
        DATA: VERACODE 2025 · ARXIV:2510.26103 · APPSEC SANTA 2026
      </text>
    </g>
  </g>

  <!-- Right: Technical Infographic Dashboard Card -->
  <g transform="translate(680, 85)" filter="url(#shadow)">
    <!-- Container Card -->
    <rect width="440" height="495" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="440" height="46" rx="20" fill="#181d26" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <circle cx="24" cy="23" r="5" fill="#ef4444"/>
    <circle cx="40" cy="23" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="23" r="5" fill="#10b981"/>
    <text x="220" y="28" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">appsec-benchmark-matrix.json</text>

    <!-- Content: Synthetic vs Reality Analysis -->
    <g transform="translate(28, 75)">
      <!-- Metric Row 1: XSS Failure Rate -->
      <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Cross-Site Scripting (XSS)</text>
      <text x="384" y="16" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#ef4444">86% Failed</text>
      <rect x="0" y="26" width="384" height="8" rx="4" fill="#262c38"/>
      <rect x="0" y="26" width="330" height="8" rx="4" fill="#ef4444"/>

      <!-- Metric Row 2: Log Injection -->
      <g transform="translate(0, 50)">
        <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Log Injection Exploits</text>
        <text x="384" y="16" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#f97316">88% Failed</text>
        <rect x="0" y="26" width="384" height="8" rx="4" fill="#262c38"/>
        <rect x="0" y="26" width="338" height="8" rx="4" fill="#f97316"/>
      </g>

      <!-- Metric Row 3: Java Failure Rate -->
      <g transform="translate(0, 100)">
        <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Java Language Vulnerability Rate</text>
        <text x="384" y="16" text-anchor="end" font-family="monospace" font-size="13" font-weight="700" fill="#f43f5e">&gt; 70% Riskiest</text>
        <rect x="0" y="26" width="384" height="8" rx="4" fill="#262c38"/>
        <rect x="0" y="26" width="272" height="8" rx="4" fill="#f43f5e"/>
      </g>

      <!-- Metric Row 4: Model Size Invariant -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="384" height="62" rx="10" fill="#1b212c" stroke="#334155" stroke-width="1"/>
        <text x="16" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">CRITICAL RESEARCH FINDING</text>
        <text x="16" y="45" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">
          Model parameter size showed <tspan font-weight="700" fill="#fca5a5">0% correlation</tspan> to security.
        </text>
      </g>

      <!-- Verification Badge Pill Box -->
      <g transform="translate(0, 230)">
        <rect x="0" y="0" width="384" height="120" rx="14" fill="#0c1914" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
        <circle cx="28" cy="28" r="12" fill="#10b981" fill-opacity="0.2"/>
        <path d="M22 28 L26 32 L34 24" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="50" y="33" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#34d399">Defense Gate: AST-Level SAST Policy</text>

        <text x="18" y="65" font-family="monospace" font-size="12" fill="#94a3b8">✓ Context-aware sanitizeHtml() injection</text>
        <text x="18" y="85" font-family="monospace" font-size="12" fill="#94a3b8">✓ Structured logging (no raw string format)</text>
        <text x="18" y="105" font-family="monospace" font-size="12" fill="#94a3b8">✓ Real PR CWE detection rate: 12.1%</text>
      </g>
    </g>
  </g>
</svg>