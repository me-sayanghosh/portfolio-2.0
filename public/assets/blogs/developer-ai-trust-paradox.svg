<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="trustGlow1" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="trustGlow2" cx="80%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trustCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0c0e17" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="blueTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="trustShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#080a0f"/>
  <rect width="1200" height="675" fill="url(#trustGlow1)"/>
  <rect width="1200" height="675" fill="url(#trustGlow2)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675"/>
  </g>

  <!-- Left: Content -->
  <g transform="translate(80, 110)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4.5" fill="#818cf8"/>
    <text x="32" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="1.2">DEVELOPER EXPERIENCE</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1.2">
      Developers Use AI
    </text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#blueTextGrad)" letter-spacing="-1.2">
      More Than Ever.
    </text>

    <!-- Neon Yellow/Lime Highlight Pill (Matching user's style) -->
    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="280" height="42" rx="8" fill="#facc15"/>
      <text x="14" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="900" fill="#0f172a" letter-spacing="-0.5">AND TRUST IT LESS.</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="250" font-family="-apple-system, sans-serif" font-size="17" fill="#94a3b8" font-weight="400">
      Adoption climbed from 76% to 84% in Stack Overflow's survey.
    </text>
    <text x="0" y="276" font-family="-apple-system, sans-serif" font-size="17" fill="#94a3b8" font-weight="400">
      Yet trust in its accuracy cratered to just 33%. The "Trust-but-Verify" playbook.
    </text>

    <!-- Metric Callouts -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="150" height="58" rx="12" fill="#13231d" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2"/>
      <text x="16" y="24" font-family="monospace" font-size="11" fill="#34d399" font-weight="600">AI ADOPTION</text>
      <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">84% <tspan font-size="13" fill="#34d399">▲ +8%</tspan></text>

      <rect x="165" y="0" width="150" height="58" rx="12" fill="#241718" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.2"/>
      <text x="181" y="24" font-family="monospace" font-size="11" fill="#f87171" font-weight="600">ACCURACY TRUST</text>
      <text x="181" y="48" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">33% <tspan font-size="13" fill="#ef4444">▼ -10%</tspan></text>

      <rect x="330" y="0" width="165" height="58" rx="12" fill="#241e16" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.2"/>
      <text x="346" y="24" font-family="monospace" font-size="11" fill="#fbbf24" font-weight="600">DEBUG TIME TAX</text>
      <text x="346" y="48" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">45% <tspan font-size="12" fill="#94a3b8">STRUGGLE</tspan></text>
    </g>

    <!-- Editorial Footer -->
    <g transform="translate(0, 425)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#64748b" letter-spacing="0.5">
        SOURCE: STACK OVERFLOW 2025/2026 DEVELOPER DATA · TECH.CO · IT BRIEF
      </text>
    </g>
  </g>

  <!-- Right: The Divergence Chart Card -->
  <g transform="translate(680, 85)" filter="url(#trustShadow)">
    <rect width="440" height="495" rx="20" fill="url(#trustCard)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

    <rect width="440" height="46" rx="20" fill="#171b26" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    <circle cx="24" cy="23" r="5" fill="#ef4444"/>
    <circle cx="40" cy="23" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="23" r="5" fill="#10b981"/>
    <text x="220" y="28" text-anchor="middle" font-family="monospace" font-size="12" fill="#94a3b8">developer-trust-divergence.chart</text>

    <!-- Visual Divergence Curves -->
    <g transform="translate(30, 80)">
      <text x="0" y="16" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">The AI Sentiment Scissors</text>
      <text x="0" y="34" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Adoption explodes as trust plummets</text>

      <!-- Chart axes & grid -->
      <g transform="translate(0, 55)">
        <line x1="0" y1="0" x2="380" y2="0" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="4 4"/>
        <line x1="0" y1="50" x2="380" y2="50" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="4 4"/>
        <line x1="0" y1="100" x2="380" y2="100" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="4 4"/>
        <line x1="0" y1="150" x2="380" y2="150" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="4 4"/>

        <!-- Green Usage Line: 76% -> 84% -->
        <path d="M 40 40 L 340 15" stroke="#10b981" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="40" cy="40" r="5" fill="#10b981"/>
        <circle cx="340" cy="15" r="6" fill="#34d399"/>
        <text x="340" y="-3" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">84% Usage</text>

        <!-- Red Trust Line: 43% -> 33% -->
        <path d="M 40 110 L 340 135" stroke="#ef4444" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <circle cx="40" cy="110" r="5" fill="#ef4444"/>
        <circle cx="340" cy="135" r="6" fill="#f87171"/>
        <text x="340" y="156" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#f87171">33% Trust</text>

        <!-- X Axis labels -->
        <text x="40" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">2024</text>
        <text x="340" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748b">2025-2026</text>
      </g>

      <!-- Pain Point & Delegation Matrix -->
      <g transform="translate(0, 255)">
        <rect x="0" y="0" width="380" height="110" rx="12" fill="#10141f" stroke="#3730a3" stroke-width="1.2"/>
        <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">THE "TRUST BUT VERIFY" CONTRACT</text>
        
        <g transform="translate(16, 44)">
          <rect x="0" y="0" width="75" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
          <text x="37" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">DELEGATE</text>
          <text x="85" y="15" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Regex, mock factories, CRUD boilerplate</text>
        </g>

        <g transform="translate(16, 74)">
          <rect x="0" y="0" width="75" height="22" rx="4" fill="#ef4444" fill-opacity="0.2"/>
          <text x="37" y="15" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#f87171">RETAIN</text>
          <text x="85" y="15" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Auth, financial transactions, database schema</text>
        </g>
      </g>
    </g>
  </g>
</svg>